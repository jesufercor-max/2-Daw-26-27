<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AulaActiva | Fotografía</title>
</head>

<body>
    <header>
        <p>AulaActiva</p>
        <div class="menu">
            <a href="#informacion">El taller</a>
            <a href="#inscripcion">Solicitar plaza</a>
        </div>
    </header>
    <div class="contenido">
        <div class="titulo">Fotografía con móvil</div>
        <section id="informacion">
            <h2>Información del taller</h2>
            <p>Aprende a encuadrar y aprovechar la luz.</p>
            <img src="imagenes/taller.jpg" width="480" height="270">
            <ul>
                <li>Duración: dos horas.</li>
                <li>Material: móvil con cámara.</li>
            </ul>
        </section>
        <section id="solicitud">
            <h2>Solicitud de plaza</h2>
            <p>Demostración: utiliza datos ficticios.</p>
            <form method="get">
                <label for="email">Correo (obligatorio)</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
                <button type="submit">Probar solicitud</button>
            </form>
        </section>
    </div>
    <footer>
        <p>AulaActiva · Proyecto de clase</p>
    </footer>
</body>

</html>
