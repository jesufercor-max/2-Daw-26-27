<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de mi aula</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/claro.css" title="Claro">
<link rel="alternate stylesheet" href="css/oscuro.css" title="Oscuro">
<link rel="stylesheet" href="css/impresion.css" media="print">

<script src="js/temas.js" defer></script>
</head>

<body>
<header class="cabecera">
  <div class="contenedor">
    <h1>Biblioteca de mi aula</h1>

    <div class="controles">
      <label for="selector-tema">Presentación</label>
      <select id="selector-tema" aria-label="Seleccionar presentación">
        <option value="claro">Claro</option>
        <option value="oscuro">Oscuro</option>
      </select>
    </div>
  </div>
</header>

<main class="contenedor">
  <section class="tarjeta">
    <h2>Recomendaciones</h2>
    <p>Estos libros pueden ser útiles para aprender, practicar y descubrir nuevos temas durante el curso.</p>
  </section>

  <section class="tarjeta">
    <h2>Horario</h2>
    <p>Consulta en clase el horario actualizado de las actividades de lectura y estudio.</p>
    <p><a href="#recomendaciones">Volver a las recomendaciones</a></p>
  </section>
</main>
</body>
</html>
