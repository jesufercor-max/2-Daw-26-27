<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora de Antonio Bueno</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor-calculadora">
<div class="letrasCalculadora">
    <h1>Calculadora</h1>
</div>
    <input type="text" id="pantalla" readonly />

    <div class="botones">
      <button class="boton" data-accion="borrar">C</button>
      <button class="boton" data-accion="cambiar-signo">±</button>
      <button class="boton" data-accion="porcentaje">%</button>
      <button class="boton operador" data-valor="/">÷</button>

      <button class="boton numero" data-valor="7">7</button>
      <button class="boton numero" data-valor="8">8</button>
      <button class="boton numero" data-valor="9">9</button>
      <button class="boton operador" data-valor="*">×</button>

      <button class="boton numero" data-valor="4">4</button>
      <button class="boton numero" data-valor="5">5</button>
      <button class="boton numero" data-valor="6">6</button>
      <button class="boton operador" data-valor="-">−</button>

      <button class="boton numero" data-valor="1">1</button>
      <button class="boton numero" data-valor="2">2</button>
      <button class="boton numero" data-valor="3">3</button>
      <button class="boton operador" data-valor="+">+</button>

      <button class="boton" data-accion="raiz">√</button>
      <button class="boton numero" data-valor="0">0</button>
      <button class="boton" data-valor=".">.</button>
      <button class="boton igual" data-accion="calcular">=</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
